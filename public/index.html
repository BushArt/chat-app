<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden { display: none !important; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }

    #auth-screen h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
    }

    #auth-screen input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #auth-screen input:focus { border-color: #0084ff; }

    #auth-screen button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    #btn-login { background: #0084ff; color: white; }
    #btn-register { background: #e4e6eb; color: #111; }

    #auth-error {
      color: red;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #chat-header {
      background: #0084ff;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #chat-header span { font-size: 15px; }

    #chat-header button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ── MAIN LAYOUT: sidebar + chat area ── */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR (online users) ── */
    #sidebar {
      width: 180px;
      border-right: 1px solid #e4e6eb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: #fafafa;
    }

    #sidebar-title {
      padding: 12px 14px;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e4e6eb;
    }

    #online-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    /* Each person in the online list */
    .online-user {
      padding: 8px 14px;
      font-size: 14px;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 6px;
      margin: 0 6px;
    }

    .online-user:hover { background: #e4e6eb; }

    /* Green dot */
    .online-dot {
      width: 8px;
      height: 8px;
      background: #31a24c;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── CHAT AREA ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TABS ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #e4e6eb;
      flex-shrink: 0;
      background: white;
    }

    .tab {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #555;
      font-weight: bold;
      transition: all 0.15s;
    }

    .tab:hover { color: #0084ff; }

    .tab.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
    }

    /* ── TAB PANELS ── */
    .tab-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── PRIVATE CHAT recipient bar ── */
    #recipient-bar {
      padding: 10px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e4e6eb;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #recipient-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    #recipient-bar button {
      padding: 8px 16px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background: #0084ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background: #e4e6eb;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .message .meta {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 4px 0;
    }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #e4e6eb;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }

    .input-area input:focus { border-color: #0084ff; }

    .input-area button {
      padding: 10px 20px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    /* Global chat badge on tab */
    #global-tab-badge {
      background: #e41e3f;
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 6px;
      display: none;
    }
  </style>
</head>

<body>

  <!-- ── AUTH SCREEN ── -->
  <div id="auth-screen">
    <h1>💬 Chat App</h1>
    <input type="text"     id="username-input" placeholder="Username"/>
    <input type="password" id="password-input" placeholder="Password"/>
    <button id="btn-login"    onclick="login()">Log In</button>
    <button id="btn-register" onclick="register()">Create Account</button>
    <p id="auth-error"></p>
  </div>

  <!-- ── CHAT SCREEN ── -->
  <div id="chat-screen" class="hidden">

    <!-- Header -->
    <div id="chat-header">
      <span id="logged-in-as">Logged in as: </span>
      <button onclick="logout()">Log Out</button>
    </div>

    <!-- Main layout: sidebar + chat area -->
    <div id="main-layout">

      <!-- Online users sidebar -->
      <div id="sidebar">
        <div id="sidebar-title">🟢 Online</div>
        <div id="online-list"></div>
      </div>

      <!-- Chat area -->
      <div id="chat-area">

        <!-- Tabs -->
        <div id="tabs">
          <div class="tab active" id="tab-global" onclick="switchTab('global')">
            🌐 Global Chat
            <span id="global-tab-badge"></span>
          </div>
          <div class="tab" id="tab-private" onclick="switchTab('private')">
            💬 Private Chat
          </div>
        </div>

        <!-- Global Chat Panel -->
        <div class="tab-panel" id="panel-global">
          <div class="messages" id="global-messages"></div>
          <div class="input-area">
            <input
              type="text"
              id="global-input"
              placeholder="Message everyone..."
              onkeydown="if(event.key==='Enter') sendGlobalMessage()"
            />
            <button onclick="sendGlobalMessage()">Send</button>
          </div>
        </div>

        <!-- Private Chat Panel -->
        <div class="tab-panel hidden" id="panel-private">
          <div id="recipient-bar">
            <span style="font-size:14px;color:#555;">Chat with:</span>
            <input type="text" id="recipient-input" placeholder="Enter username..."/>
            <button onclick="startChat()">Open</button>
          </div>
          <div class="messages" id="private-messages"></div>
          <div class="input-area">
            <input
              type="text"
              id="private-input"
              placeholder="Type a message..."
              onkeydown="if(event.key==='Enter') sendPrivateMessage()"
            />
            <button onclick="sendPrivateMessage()">Send</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ── STATE ──
    let currentUser     = null;
    let currentToken    = null;
    let currentRoom     = null;
    let currentRecipient = null;
    let activeTab       = 'global';
    let unreadGlobal    = 0;

    const socket = io();

    // ── HELPERS ──
    function getRoomId(a, b) { return [a, b].sort().join('_'); }

    function formatTime(d) {
      const dt = new Date(d);
      return dt.getHours().toString().padStart(2,'0') + ':' +
             dt.getMinutes().toString().padStart(2,'0');
    }

    function appendMessage(containerId, sender, text, time, type) {
      const container = document.getElementById(containerId);
      const bubble = document.createElement('div');
      bubble.classList.add('message', type);
      bubble.innerHTML = `
        <div>${text}</div>
        <div class="meta">${type === 'received' ? sender + ' · ' : ''}${time}</div>
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystem(containerId, text) {
      const container = document.getElementById(containerId);
      const p = document.createElement('p');
      p.classList.add('system-msg');
      p.textContent = text;
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;
    }

    // ── TABS ──
    function switchTab(tab) {
      activeTab = tab;

      document.getElementById('panel-global').classList.toggle('hidden', tab !== 'global');
      document.getElementById('panel-private').classList.toggle('hidden', tab !== 'private');
      document.getElementById('tab-global').classList.toggle('active', tab === 'global');
      document.getElementById('tab-private').classList.toggle('active', tab === 'private');

      // Clear unread badge when switching to global
      if (tab === 'global') {
        unreadGlobal = 0;
        const badge = document.getElementById('global-tab-badge');
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    // ── ONLINE USERS SIDEBAR ──
    function renderOnlineUsers(users) {
      const list = document.getElementById('online-list');
      list.innerHTML = '';
      users.forEach(username => {
        const div = document.createElement('div');
        div.classList.add('online-user');
        div.innerHTML = `<span class="online-dot"></span>${username}`;
        // Clicking a name opens a private chat with them
        div.onclick = () => {
          if (username === currentUser) return;
          document.getElementById('recipient-input').value = username;
          switchTab('private');
          startChat();
        };
        list.appendChild(div);
      });
    }

    // ── AUTH ──
    async function register() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errorEl  = document.getElementById('auth-error');
      if (!username || !password) { errorEl.textContent = 'Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; return; }
        errorEl.style.color = 'green';
        errorEl.textContent = 'Account created! You can now log in.';
      } catch { errorEl.textContent = 'Could not connect to server.'; }
    }

    async function login() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errorEl  = document.getElementById('auth-error');
      if (!username || !password) { errorEl.textContent = 'Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.style.color = 'red'; errorEl.textContent = data.error; return; }

        currentToken = data.token;
        currentUser  = data.username;

        document.getElementById('logged-in-as').textContent = `Logged in as: ${currentUser}`;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');

        // Tell server this user is online — triggers join to global room
        socket.emit('user_online', currentUser);

        // Load global chat history
        loadGlobalHistory();

      } catch { errorEl.textContent = 'Could not connect to server.'; }
    }

    function logout() {
      currentUser = currentToken = currentRoom = currentRecipient = null;
      ['global-messages','private-messages','online-list'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      document.getElementById('recipient-input').value   = '';
      document.getElementById('username-input').value    = '';
      document.getElementById('password-input').value    = '';
      document.getElementById('auth-error').textContent  = '';
      document.getElementById('auth-error').style.color  = 'red';
      switchTab('global');
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    // ── GLOBAL CHAT ──
    async function loadGlobalHistory() {
      try {
        const res      = await fetch('/messages/global');
        const history  = await res.json();
        if (history.length === 0) {
          appendSystem('global-messages', 'Welcome to Global Chat! Say hello 👋');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('global-messages', msg.sender, msg.message, formatTime(msg.createdAt), type);
          });
        }
      } catch { appendSystem('global-messages', 'Could not load history.'); }
    }

    function sendGlobalMessage() {
      const input = document.getElementById('global-input');
      const text  = input.value.trim();
      if (!text) return;
      socket.emit('send_global_message', { sender: currentUser, message: text });
      input.value = '';
    }

    // Receive global messages in real time
    socket.on('receive_global_message', (data) => {
      const type = data.sender === currentUser ? 'sent' : 'received';
      appendMessage('global-messages', data.sender, data.message, formatTime(data.createdAt), type);

      // If user is on private tab, show unread badge on Global tab
      if (activeTab !== 'global' && data.sender !== currentUser) {
        unreadGlobal++;
        const badge = document.getElementById('global-tab-badge');
        badge.textContent = unreadGlobal;
        badge.style.display = 'inline';
      }
    });

    // ── PRIVATE CHAT ──
    async function startChat() {
      const recipient = document.getElementById('recipient-input').value.trim();
      if (!recipient || recipient === currentUser) return;

      currentRecipient = recipient;
      currentRoom      = getRoomId(currentUser, recipient);

      document.getElementById('private-messages').innerHTML = '';
      socket.emit('join_room', currentRoom);
      appendSystem('private-messages', `Now chatting with ${recipient}`);

      try {
        const res     = await fetch(`/messages/${currentUser}/${recipient}`);
        const history = await res.json();
        if (history.length === 0) {
          appendSystem('private-messages', 'No messages yet. Say hello!');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('private-messages', msg.sender, msg.message, formatTime(msg.createdAt), type);
          });
        }
      } catch { appendSystem('private-messages', 'Could not load history.'); }
    }

    function sendPrivateMessage() {
      const input = document.getElementById('private-input');
      const text  = input.value.trim();
      if (!text) return;
      if (!currentRoom) { appendSystem('private-messages', 'Open a chat first.'); return; }
      socket.emit('send_message', {
        sender: currentUser, receiver: currentRecipient,
        message: text, room: currentRoom
      });
      input.value = '';
    }

    socket.on('receive_message', (data) => {
      const type = data.sender === currentUser ? 'sent' : 'received';
      appendMessage('private-messages', data.sender, data.message, formatTime(data.createdAt), type);
    });

    // ── ONLINE USERS ──
    socket.on('online_users', renderOnlineUsers);

    // ── CONNECTION ──
    socket.on('connect',    () => console.log('Socket connected:', socket.id));
    socket.on('disconnect', () => console.log('Socket disconnected'));
  </script>
</body>
</html>
