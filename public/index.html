<!DOCTYPE html>
<!-- lang="zh" tells the browser to expect CJK text, which improves
     IME (Input Method Editor) behaviour, font selection, and
     line-breaking for users typing in Chinese. -->
<html lang="zh-Hans">
<head>
  <!-- charset MUST be the very first tag inside <head> so the browser
       knows how to decode the rest of the document before parsing anything.
       UTF-8 supports every Chinese, Japanese, Korean, Arabic, etc. character
       as well as all emoji. -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* System font stack that prioritises CJK-aware fonts on every OS:
         - Windows: Microsoft YaHei (Simplified Chinese)
         - macOS/iOS: PingFang SC
         - Android: Noto Sans CJK
         Falls back to a generic sans-serif on any other platform. */
      font-family:
        'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC',
        'Hiragino Sans GB', 'WenQuanYi Micro Hei',
        Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden { display: none !important; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }

    #auth-screen h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
    }

    #auth-screen input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      /* Same font stack as body so Chinese input appears correctly */
      font-family: inherit;
      outline: none;
      /* ime-mode is non-standard but still widely honoured on Windows.
         'active' tells Windows to open the IME automatically for text fields. */
      ime-mode: active;
    }

    #auth-screen input:focus { border-color: #0084ff; }

    #auth-screen button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }

    #btn-login    { background: #0084ff; color: white; }
    #btn-register { background: #e4e6eb; color: #111; }

    #auth-error {
      color: red;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
      /* Allow long CJK error messages to wrap naturally */
      word-break: break-word;
    }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #chat-header {
      background: #0084ff;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #chat-header span {
      font-size: 15px;
      /* Prevent very long CJK usernames from pushing the logout button off-screen */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    #chat-header button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      flex-shrink: 0;
    }

    /* ── MAIN LAYOUT: sidebar + chat area ── */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR (online users) ── */
    #sidebar {
      width: 180px;
      border-right: 1px solid #e4e6eb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: #fafafa;
    }

    #sidebar-title {
      padding: 12px 14px;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e4e6eb;
    }

    #online-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .online-user {
      padding: 8px 14px;
      font-size: 14px;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 6px;
      margin: 0 6px;
      /* CJK names should not be truncated with ellipsis — wrap instead */
      word-break: break-all;
    }

    .online-user:hover { background: #e4e6eb; }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #31a24c;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── CHAT AREA ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TABS ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #e4e6eb;
      flex-shrink: 0;
      background: white;
    }

    .tab {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #555;
      font-weight: bold;
      transition: all 0.15s;
    }

    .tab:hover { color: #0084ff; }

    .tab.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
    }

    /* ── TAB PANELS ── */
    .tab-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── PRIVATE CHAT recipient bar ── */
    #recipient-bar {
      padding: 10px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e4e6eb;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #recipient-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      ime-mode: active;
    }

    #recipient-bar button {
      padding: 8px 16px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      flex-shrink: 0;
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;      /* slightly more than 1.4 — CJK glyphs need space */
      /* break-all ensures Chinese text (which has no spaces) wraps inside
         the bubble instead of overflowing it */
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background: #0084ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background: #e4e6eb;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .message .meta {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 4px 0;
      word-break: break-word;
    }

    /* ── CHAR COUNTER ── */
    .char-counter {
      font-size: 11px;
      color: #999;
      text-align: right;
      padding: 0 16px 4px;
      flex-shrink: 0;
    }
    .char-counter.warn  { color: #e8a000; }
    .char-counter.limit { color: #e41e3f; }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #e4e6eb;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      /* ime-mode: active tells the OS to keep the IME open while the user
         is typing in this field.  This prevents the frustrating behaviour
         where an IME (pinyin, wubi, etc.) closes mid-sentence. */
      ime-mode: active;
    }

    .input-area input:focus { border-color: #0084ff; }

    .input-area button {
      padding: 10px 20px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      flex-shrink: 0;
    }

    /* Global chat badge on tab */
    #global-tab-badge {
      background: #e41e3f;
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 6px;
      display: none;
    }
  </style>
</head>

<body>

  <!-- ── AUTH SCREEN ── -->
  <div id="auth-screen">
    <h1>💬 Chat App</h1>
    <!-- maxlength matches server-side USERNAME_MAX (32 characters).
         For Chinese usernames one character = one maxlength unit, which
         is what we want. -->
    <input type="text"     id="username-input" placeholder="用户名 / Username" maxlength="32"/>
    <input type="password" id="password-input" placeholder="密码 / Password"  maxlength="128" autocomplete="current-password"/>
    <button id="btn-login"    onclick="login()">登录 / Log In</button>
    <button id="btn-register" onclick="register()">注册 / Create Account</button>
    <p id="auth-error"></p>
  </div>

  <!-- ── CHAT SCREEN ── -->
  <div id="chat-screen" class="hidden">

    <!-- Header -->
    <div id="chat-header">
      <span id="logged-in-as">已登录 / Logged in as: </span>
      <button onclick="logout()">退出 / Log Out</button>
    </div>

    <!-- Main layout: sidebar + chat area -->
    <div id="main-layout">

      <!-- Online users sidebar -->
      <div id="sidebar">
        <div id="sidebar-title">🟢 Online</div>
        <div id="online-list"></div>
      </div>

      <!-- Chat area -->
      <div id="chat-area">

        <!-- Tabs -->
        <div id="tabs">
          <div class="tab active" id="tab-global" onclick="switchTab('global')">
            🌐 Global Chat
            <span id="global-tab-badge"></span>
          </div>
          <div class="tab" id="tab-private" onclick="switchTab('private')">
            💬 Private Chat
          </div>
        </div>

        <!-- Global Chat Panel -->
        <div class="tab-panel" id="panel-global">
          <div class="messages" id="global-messages"></div>
          <div class="char-counter" id="global-counter"></div>
          <div class="input-area">
            <input
              type="text"
              id="global-input"
              placeholder="发送消息… / Message everyone…"
              maxlength="2000"
              autocomplete="off"
              oninput="updateCounter('global')"
              onkeydown="handleGlobalKey(event)"
            />
            <button onclick="sendGlobalMessage()">发送 / Send</button>
          </div>
        </div>

        <!-- Private Chat Panel -->
        <div class="tab-panel hidden" id="panel-private">
          <div id="recipient-bar">
            <span style="font-size:14px;color:#555;">Chat with:</span>
            <input type="text" id="recipient-input" placeholder="用户名 / Username" maxlength="32"/>
            <button onclick="startChat()">Open</button>
          </div>
          <div class="messages" id="private-messages"></div>
          <div class="char-counter" id="private-counter"></div>
          <div class="input-area">
            <input
              type="text"
              id="private-input"
              placeholder="发送消息… / Type a message…"
              maxlength="2000"
              autocomplete="off"
              oninput="updateCounter('private')"
              onkeydown="handlePrivateKey(event)"
            />
            <button onclick="sendPrivateMessage()">发送 / Send</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ── STATE ──
    let currentUser      = null;
    let currentToken     = null;
    let currentRoom      = null;
    let currentRecipient = null;
    let activeTab        = 'global';
    let unreadGlobal     = 0;

    // ── SOCKET ──
    // Socket is created without auth initially; we reconnect with the
    // JWT token after login so the server can verify the handshake.
    let socket = null;

    const MAX_LENGTH = 2000;

    // ── HELPERS ──
    function getRoomId(a, b) { return [a, b].sort().join('_'); }

    function formatTime(d) {
      const dt = new Date(d);
      return dt.getHours().toString().padStart(2, '0') + ':' +
             dt.getMinutes().toString().padStart(2, '0');
    }

    // Render a chat bubble.
    // We use textContent (not innerHTML) for the message body so that
    // any HTML that slipped through is displayed as literal text, not
    // executed. The server also escapes < and > as a second layer of defence.
    function appendMessage(containerId, sender, text, time, type) {
      const container = document.getElementById(containerId);
      const bubble = document.createElement('div');
      bubble.classList.add('message', type);

      const body = document.createElement('div');
      body.textContent = text;  // safe: no innerHTML

      const meta = document.createElement('div');
      meta.classList.add('meta');
      meta.textContent = (type === 'received' ? sender + ' · ' : '') + time;

      bubble.appendChild(body);
      bubble.appendChild(meta);
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystem(containerId, text) {
      const container = document.getElementById(containerId);
      const p = document.createElement('p');
      p.classList.add('system-msg');
      p.textContent = text;
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;
    }

    // ── CHARACTER COUNTER ──
    // Counts Unicode code points (characters), not bytes, so Chinese
    // users see the same remaining count as English users per character typed.
    function updateCounter(tab) {
      const inputId   = tab === 'global' ? 'global-input' : 'private-input';
      const counterId = tab === 'global' ? 'global-counter' : 'private-counter';
      const input   = document.getElementById(inputId);
      const counter = document.getElementById(counterId);
      const len = [...input.value].length;  // spread into array → code points, not UTF-16 code units
      const remaining = MAX_LENGTH - len;
      counter.textContent = remaining < MAX_LENGTH ? `${remaining} remaining` : '';
      counter.className = 'char-counter' +
        (remaining <= 0 ? ' limit' : remaining <= 200 ? ' warn' : '');
    }

    // ── KEYBOARD HANDLERS ──
    // We cannot simply use onkeydown="if(event.key==='Enter') send()"
    // because on Chinese IMEs the Enter key is used to *confirm* a
    // character selection from the candidate list — pressing Enter during
    // IME composition must NOT send the message.
    // The isComposing flag is set to true while an IME is composing text.
    function handleGlobalKey(event) {
      if (event.key === 'Enter' && !event.isComposing) sendGlobalMessage();
    }

    function handlePrivateKey(event) {
      if (event.key === 'Enter' && !event.isComposing) sendPrivateMessage();
    }

    // ── TABS ──
    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('panel-global').classList.toggle('hidden', tab !== 'global');
      document.getElementById('panel-private').classList.toggle('hidden', tab !== 'private');
      document.getElementById('tab-global').classList.toggle('active', tab === 'global');
      document.getElementById('tab-private').classList.toggle('active', tab === 'private');

      if (tab === 'global') {
        unreadGlobal = 0;
        const badge = document.getElementById('global-tab-badge');
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    // ── ONLINE USERS SIDEBAR ──
    function renderOnlineUsers(users) {
      const list = document.getElementById('online-list');
      list.innerHTML = '';
      users.forEach(username => {
        const div = document.createElement('div');
        div.classList.add('online-user');

        const dot = document.createElement('span');
        dot.classList.add('online-dot');

        const name = document.createElement('span');
        name.textContent = username;  // textContent — safe for any script

        div.appendChild(dot);
        div.appendChild(name);

        div.onclick = () => {
          if (username === currentUser) return;
          document.getElementById('recipient-input').value = username;
          switchTab('private');
          startChat();
        };
        list.appendChild(div);
      });
    }

    // ── AUTH ──
    async function register() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const errorEl  = document.getElementById('auth-error');
      errorEl.style.color = 'red';
      if (!username || !password) { errorEl.textContent = '请填写所有字段 / Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; return; }
        errorEl.style.color = 'green';
        errorEl.textContent = '账号已创建！/ Account created! You can now log in.';
      } catch { errorEl.textContent = '无法连接服务器 / Could not connect to server.'; }
    }

    async function login() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const errorEl  = document.getElementById('auth-error');
      errorEl.style.color = 'red';
      if (!username || !password) { errorEl.textContent = '请填写所有字段 / Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; return; }

        currentToken = data.token;
        currentUser  = data.username;

        document.getElementById('logged-in-as').textContent = `已登录为 / Logged in as: ${currentUser}`;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');

        // Connect socket WITH the JWT token so the server can verify
        // the handshake before allowing any events.
        connectSocket();

        // Load global chat history (now sends the Bearer token)
        loadGlobalHistory();

      } catch { errorEl.textContent = '无法连接服务器 / Could not connect to server.'; }
    }

    function logout() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      currentUser = currentToken = currentRoom = currentRecipient = null;
      unreadGlobal = 0;
      ['global-messages', 'private-messages', 'online-list'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      ['global-counter', 'private-counter'].forEach(id => {
        document.getElementById(id).textContent = '';
      });
      document.getElementById('recipient-input').value  = '';
      document.getElementById('username-input').value   = '';
      document.getElementById('password-input').value   = '';
      document.getElementById('global-input').value     = '';
      document.getElementById('private-input').value    = '';
      document.getElementById('auth-error').textContent = '';
      document.getElementById('auth-error').style.color = 'red';
      switchTab('global');
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    // ── SOCKET CONNECTION ──
    function connectSocket() {
      // Pass the JWT in the auth object.  Socket.IO sends this during
      // the handshake so the server's io.use() middleware can verify it
      // before the connection is fully established.
      socket = io({
        auth: { token: currentToken }
      });

      socket.on('connect', () => {
        console.log('Socket connected:', socket.id);
        // user_online is now a no-op on the server (we rely on the JWT),
        // but we still emit it for compatibility in case you roll back.
        socket.emit('user_online', currentUser);
      });

      socket.on('connect_error', (err) => {
        console.error('Socket connection error:', err.message);
        // If auth fails, show the error and log the user out
        if (err.message.includes('Authentication') || err.message.includes('token')) {
          const errorEl = document.getElementById('auth-error');
          errorEl.textContent = 'Session expired. Please log in again.';
          logout();
        }
      });

      socket.on('disconnect', () => console.log('Socket disconnected'));

      // ── RECEIVE GLOBAL MESSAGES ──
      socket.on('receive_global_message', (data) => {
        const type = data.sender === currentUser ? 'sent' : 'received';
        appendMessage('global-messages', data.sender, data.message, formatTime(data.createdAt), type);

        if (activeTab !== 'global' && data.sender !== currentUser) {
          unreadGlobal++;
          const badge = document.getElementById('global-tab-badge');
          badge.textContent = unreadGlobal;
          badge.style.display = 'inline';
        }
      });

      // ── RECEIVE PRIVATE MESSAGES ──
      socket.on('receive_message', (data) => {
        const type = data.sender === currentUser ? 'sent' : 'received';
        appendMessage('private-messages', data.sender, data.message, formatTime(data.createdAt), type);
      });

      // ── ONLINE USERS ──
      socket.on('online_users', renderOnlineUsers);
    }

    // ── GLOBAL CHAT ──
    // Sends the JWT in the Authorization header so the server can verify
    // who is requesting the history.
    async function loadGlobalHistory() {
      try {
        const res = await fetch('/messages/global', {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        if (!res.ok) throw new Error('Not authorized');
        const history = await res.json();
        if (history.length === 0) {
          appendSystem('global-messages', 'Welcome to Global Chat! Say hello 👋');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('global-messages', msg.sender, msg.message, formatTime(msg.createdAt), type);
          });
        }
      } catch { appendSystem('global-messages', 'Could not load history.'); }
    }

    function sendGlobalMessage() {
      const input = document.getElementById('global-input');
      const text  = input.value.trim();
      if (!text || !socket) return;
      if ([...text].length > MAX_LENGTH) return;  // code-point length check
      socket.emit('send_global_message', { sender: currentUser, message: text });
      input.value = '';
      updateCounter('global');
    }

    // ── PRIVATE CHAT ──
    async function startChat() {
      const recipient = document.getElementById('recipient-input').value.trim();
      if (!recipient || recipient === currentUser || !socket) return;

      currentRecipient = recipient;
      currentRoom      = getRoomId(currentUser, recipient);

      document.getElementById('private-messages').innerHTML = '';
      socket.emit('join_room', currentRoom);
      appendSystem('private-messages', `Now chatting with ${recipient}`);

      try {
        const res = await fetch(`/messages/${currentUser}/${recipient}`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        if (!res.ok) throw new Error('Not authorized');
        const history = await res.json();
        if (history.length === 0) {
          appendSystem('private-messages', 'No messages yet. Say hello!');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('private-messages', msg.sender, msg.message, formatTime(msg.createdAt), type);
          });
        }
      } catch { appendSystem('private-messages', 'Could not load history.'); }
    }

    function sendPrivateMessage() {
      const input = document.getElementById('private-input');
      const text  = input.value.trim();
      if (!text || !socket) return;
      if ([...text].length > MAX_LENGTH) return;
      if (!currentRoom) { appendSystem('private-messages', 'Open a chat first.'); return; }
      socket.emit('send_message', {
        sender: currentUser, receiver: currentRecipient,
        message: text, room: currentRoom
      });
      input.value = '';
      updateCounter('private');
    }
  </script>
</body>
</html>
