<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden { display: none !important; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }

    #auth-screen h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
    }

    #auth-screen input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #auth-screen input:focus { border-color: #0084ff; }

    #auth-screen button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    #btn-login { background: #0084ff; color: white; }
    #btn-register { background: #e4e6eb; color: #111; }

    #auth-error {
      color: red;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #chat-header {
      background: #0084ff;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #chat-header span { font-size: 15px; }

    #chat-header button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ── MAIN LAYOUT: sidebar + chat area ── */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR (online users) ── */
    #sidebar {
      width: 180px;
      border-right: 1px solid #e4e6eb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: #fafafa;
    }

    #sidebar-title {
      padding: 12px 14px;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e4e6eb;
    }

    #online-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .online-user {
      padding: 8px 14px;
      font-size: 14px;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 6px;
      margin: 0 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .online-user:hover { background: #e4e6eb; }
    .online-user:active { background: #d8dadf; }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #31a24c;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── CHAT AREA ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TABS ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #e4e6eb;
      flex-shrink: 0;
      background: white;
    }

    .tab {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #555;
      font-weight: bold;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab:hover { color: #0084ff; }

    .tab.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
    }

    /* ── TAB PANELS ── */
    .tab-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── PRIVATE CHAT recipient bar ── */
    #recipient-bar {
      padding: 10px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e4e6eb;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #recipient-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    #recipient-bar button {
      padding: 8px 16px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      word-break: break-word;        /* prevents CJK text overflowing */
      overflow-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background: #0084ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background: #e4e6eb;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .message .meta {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
      cursor: default;
      user-select: none;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 4px 0;
    }

    /* ── TYPING INDICATOR ── */
    .typing-indicator {
      font-size: 12px;
      color: #888;
      padding: 2px 16px 6px;
      min-height: 22px;
      flex-shrink: 0;
      font-style: italic;
    }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 10px 16px 14px;
      border-top: 1px solid #e4e6eb;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .input-area textarea {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
      display: block;
    }

    .input-area textarea:focus { border-color: #0084ff; }

    .char-counter {
      font-size: 11px;
      color: #aaa;
      text-align: right;
      padding: 2px 4px 0;
      height: 16px;
    }

    .char-counter.warn { color: #e67e22; }
    .char-counter.danger { color: #e41e3f; }

    .input-area button {
      padding: 10px 20px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      align-self: flex-end;
      margin-bottom: 18px;  /* aligns with bottom of textarea when counter is shown */
    }

    /* Global chat badge on tab */
    #global-tab-badge {
      background: #e41e3f;
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 6px;
      display: none;
    }

    /* ── MOBILE TWEAKS ── */
    @media (max-width: 600px) {
      body { align-items: flex-start; }

      #chat-screen {
        height: 100vh;
        border-radius: 0;
        max-width: 100%;
      }

      #sidebar { width: 140px; }

      .message { max-width: 80%; }

      #auth-screen {
        margin: 20px;
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ── AUTH SCREEN ── -->
  <div id="auth-screen">
    <h1>💬 Chat App</h1>
    <input type="text"     id="username-input" placeholder="Username / 用戶名" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <input type="password" id="password-input" placeholder="Password / 密碼" autocomplete="current-password"/>
    <button id="btn-login"    onclick="login()">Log In / 登入</button>
    <button id="btn-register" onclick="register()">Create Account / 建立帳號</button>
    <p id="auth-error"></p>
  </div>

  <!-- ── CHAT SCREEN ── -->
  <div id="chat-screen" class="hidden">

    <!-- Header -->
    <div id="chat-header">
      <span id="logged-in-as">Logged in as: </span>
      <button onclick="logout()">Log Out</button>
    </div>

    <!-- Main layout: sidebar + chat area -->
    <div id="main-layout">

      <!-- Online users sidebar -->
      <div id="sidebar">
        <div id="sidebar-title">🟢 Online</div>
        <div id="online-list"></div>
      </div>

      <!-- Chat area -->
      <div id="chat-area">

        <!-- Tabs -->
        <div id="tabs">
          <div class="tab active" id="tab-global" onclick="switchTab('global')">
            🌐 Global
            <span id="global-tab-badge"></span>
          </div>
          <div class="tab" id="tab-private" onclick="switchTab('private')">
            💬 Private
          </div>
        </div>

        <!-- Global Chat Panel -->
        <div class="tab-panel" id="panel-global">
          <div class="messages" id="global-messages"></div>
          <div class="typing-indicator" id="global-typing"></div>
          <div class="input-area">
            <div class="input-wrapper">
              <textarea
                id="global-input"
                placeholder="Message everyone... / 向所有人發訊息..."
                rows="1"
              ></textarea>
              <div class="char-counter" id="global-char-counter"></div>
            </div>
            <button onclick="sendGlobalMessage()">Send</button>
          </div>
        </div>

        <!-- Private Chat Panel -->
        <div class="tab-panel hidden" id="panel-private">
          <div id="recipient-bar">
            <span style="font-size:14px;color:#555;white-space:nowrap;">Chat with:</span>
            <input type="text" id="recipient-input" placeholder="Enter username..." autocorrect="off" autocapitalize="off" spellcheck="false"/>
            <button onclick="startChat()">Open</button>
          </div>
          <div class="messages" id="private-messages"></div>
          <div class="typing-indicator" id="private-typing"></div>
          <div class="input-area">
            <div class="input-wrapper">
              <textarea
                id="private-input"
                placeholder="Type a message... / 輸入訊息..."
                rows="1"
              ></textarea>
              <div class="char-counter" id="private-char-counter"></div>
            </div>
            <button onclick="sendPrivateMessage()">Send</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ── STATE ──
    let currentUser      = null;
    let currentToken     = null;
    let currentRoom      = null;
    let currentRecipient = null;
    let activeTab        = 'global';
    let unreadGlobal     = 0;

    const MAX_LEN = 1000;

    const socket = io();

    // ── HELPERS ──
    function getRoomId(a, b) { return [a, b].sort().join('_'); }

    function formatTime(d) {
      const dt = new Date(d);
      return dt.getHours().toString().padStart(2,'0') + ':' +
             dt.getMinutes().toString().padStart(2,'0');
    }

    // Relative time: "just now", "2 min ago", "3 hrs ago", etc.
    function relativeTime(d) {
      const diff = Math.floor((Date.now() - new Date(d)) / 1000);
      if (diff < 60)       return 'just now';
      if (diff < 3600)     return Math.floor(diff / 60) + ' min ago';
      if (diff < 86400)    return Math.floor(diff / 3600) + ' hr ago';
      return formatTime(d);
    }

    // Auto-resize a textarea to its content (up to max-height)
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // ── SCROLL ──
    // Only auto-scroll if user is already near the bottom (within 120px)
    function maybeScrollToBottom(containerId) {
      const el = document.getElementById(containerId);
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    function scrollToBottom(containerId) {
      const el = document.getElementById(containerId);
      el.scrollTop = el.scrollHeight;
    }

    // ── MESSAGES ──
    function appendMessage(containerId, sender, text, time, type) {
      const container = document.getElementById(containerId);
      const bubble = document.createElement('div');
      bubble.classList.add('message', type);

      const textDiv = document.createElement('div');
      textDiv.textContent = text;

      const metaDiv = document.createElement('div');
      metaDiv.classList.add('meta');
      const rel = relativeTime(time);
      const abs = formatTime(time);
      metaDiv.textContent = (type === 'received' ? sender + ' · ' : '') + rel;
      metaDiv.title = abs;  // show exact time on hover

      bubble.appendChild(textDiv);
      bubble.appendChild(metaDiv);
      container.appendChild(bubble);
      maybeScrollToBottom(containerId);
    }

    function appendSystem(containerId, text) {
      const container = document.getElementById(containerId);
      const p = document.createElement('p');
      p.classList.add('system-msg');
      p.textContent = text;
      container.appendChild(p);
      scrollToBottom(containerId);
    }

    // ── CHAR COUNTER ──
    function updateCharCounter(inputId, counterId) {
      const text = document.getElementById(inputId).value;
      const len = [...text].length; // count codepoints, not UTF-16 code units
      const remaining = MAX_LEN - len;
      const el = document.getElementById(counterId);
      if (remaining <= MAX_LEN - 10) {  // only show when user has typed something
        el.textContent = remaining + ' left';
        el.className = 'char-counter' +
          (remaining <= 50 ? ' danger' : remaining <= 200 ? ' warn' : '');
      } else {
        el.textContent = '';
        el.className = 'char-counter';
      }
    }

    // ── TYPING INDICATOR ──
    const typingState = { global: new Set(), private: new Set() };

    function showTyping(tab, username) {
      typingState[tab].add(username);
      renderTyping(tab);
    }

    function hideTyping(tab, username) {
      typingState[tab].delete(username);
      renderTyping(tab);
    }

    function renderTyping(tab) {
      const el = document.getElementById(tab + '-typing');
      const users = Array.from(typingState[tab]);
      if (users.length === 0) {
        el.textContent = '';
      } else if (users.length === 1) {
        el.textContent = users[0] + ' is typing…';
      } else {
        el.textContent = users.slice(0, 2).join(', ') + ' are typing…';
      }
    }

    // Emit typing events with debounce
    const typingTimers = {};

    function handleTyping(room, stopFn) {
      socket.emit('start_typing', { room });
      clearTimeout(typingTimers[room]);
      typingTimers[room] = setTimeout(() => {
        socket.emit('stop_typing', { room });
      }, 3000);
    }

    // ── TABS ──
    function switchTab(tab) {
      activeTab = tab;

      document.getElementById('panel-global').classList.toggle('hidden', tab !== 'global');
      document.getElementById('panel-private').classList.toggle('hidden', tab !== 'private');
      document.getElementById('tab-global').classList.toggle('active', tab === 'global');
      document.getElementById('tab-private').classList.toggle('active', tab === 'private');

      if (tab === 'global') {
        unreadGlobal = 0;
        const badge = document.getElementById('global-tab-badge');
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    // ── ONLINE USERS SIDEBAR ──
    function renderOnlineUsers(users) {
      const list = document.getElementById('online-list');
      list.innerHTML = '';
      users.forEach(username => {
        const div = document.createElement('div');
        div.classList.add('online-user');

        const dot = document.createElement('span');
        dot.classList.add('online-dot');

        const name = document.createElement('span');
        name.textContent = username;

        div.appendChild(dot);
        div.appendChild(name);

        div.onclick = () => {
          if (username === currentUser) return;
          document.getElementById('recipient-input').value = username;
          switchTab('private');
          startChat();
        };
        list.appendChild(div);
      });
    }

    // ── AUTH ──
    async function register() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errorEl  = document.getElementById('auth-error');
      if (!username || !password) { errorEl.textContent = 'Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; return; }
        errorEl.style.color = 'green';
        errorEl.textContent = data.message;
      } catch { errorEl.textContent = 'Could not connect to server.'; }
    }

    async function login() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errorEl  = document.getElementById('auth-error');
      if (!username || !password) { errorEl.textContent = 'Please fill in both fields.'; return; }
      try {
        const res  = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.style.color = 'red'; errorEl.textContent = data.error; return; }

        currentToken = data.token;
        currentUser  = data.username;

        localStorage.setItem('chat_token', currentToken);
        localStorage.setItem('chat_user', currentUser);

        document.getElementById('logged-in-as').textContent = `Logged in as: ${currentUser}`;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');

        socket.emit('user_online', currentUser);
        loadGlobalHistory();

      } catch { errorEl.textContent = 'Could not connect to server.'; }
    }

    function logout() {
      localStorage.removeItem('chat_token');
      localStorage.removeItem('chat_user');
      currentUser = currentToken = currentRoom = currentRecipient = null;
      ['global-messages','private-messages','online-list'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      document.getElementById('global-typing').textContent  = '';
      document.getElementById('private-typing').textContent = '';
      document.getElementById('recipient-input').value  = '';
      document.getElementById('username-input').value   = '';
      document.getElementById('password-input').value   = '';
      document.getElementById('auth-error').textContent = '';
      document.getElementById('auth-error').style.color = 'red';
      switchTab('global');
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    // ── GLOBAL CHAT ──
    async function loadGlobalHistory() {
      try {
        const res     = await fetch('/messages/global');
        const history = await res.json();
        if (history.length === 0) {
          appendSystem('global-messages', 'Welcome to Global Chat! Say hello 👋');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('global-messages', msg.sender, msg.message, msg.createdAt, type);
          });
          scrollToBottom('global-messages');
        }
      } catch { appendSystem('global-messages', 'Could not load history.'); }
    }

    function sendGlobalMessage() {
      const textarea = document.getElementById('global-input');
      const text = textarea.value.trim();
      if (!text) return;
      if ([...text].length > MAX_LEN) return;
      socket.emit('send_global_message', { sender: currentUser, message: text });
      socket.emit('stop_typing', { room: 'global' });
      clearTimeout(typingTimers['global']);
      textarea.value = '';
      autoResize(textarea);
      updateCharCounter('global-input', 'global-char-counter');
    }

    socket.on('receive_global_message', (data) => {
      const type = data.sender === currentUser ? 'sent' : 'received';
      appendMessage('global-messages', data.sender, data.message, data.createdAt, type);

      if (activeTab !== 'global' && data.sender !== currentUser) {
        unreadGlobal++;
        const badge = document.getElementById('global-tab-badge');
        badge.textContent = unreadGlobal;
        badge.style.display = 'inline';
      }
    });

    // ── PRIVATE CHAT ──
    async function startChat() {
      const recipient = document.getElementById('recipient-input').value.trim();
      if (!recipient || recipient === currentUser) return;

      currentRecipient = recipient;
      currentRoom      = getRoomId(currentUser, recipient);

      document.getElementById('private-messages').innerHTML = '';
      typingState.private.clear();
      renderTyping('private');
      socket.emit('join_room', currentRoom);
      appendSystem('private-messages', `Now chatting with ${recipient}`);

      try {
        const res     = await fetch(`/messages/${currentUser}/${recipient}`);
        const history = await res.json();
        if (history.length === 0) {
          appendSystem('private-messages', 'No messages yet. Say hello!');
        } else {
          history.forEach(msg => {
            const type = msg.sender === currentUser ? 'sent' : 'received';
            appendMessage('private-messages', msg.sender, msg.message, msg.createdAt, type);
          });
          scrollToBottom('private-messages');
        }
      } catch { appendSystem('private-messages', 'Could not load history.'); }
    }

    function sendPrivateMessage() {
      const textarea = document.getElementById('private-input');
      const text = textarea.value.trim();
      if (!text) return;
      if ([...text].length > MAX_LEN) return;
      if (!currentRoom) { appendSystem('private-messages', 'Open a chat first.'); return; }
      socket.emit('send_message', {
        sender: currentUser, receiver: currentRecipient,
        message: text, room: currentRoom
      });
      socket.emit('stop_typing', { room: currentRoom });
      clearTimeout(typingTimers[currentRoom]);
      textarea.value = '';
      autoResize(textarea);
      updateCharCounter('private-input', 'private-char-counter');
    }

    socket.on('receive_message', (data) => {
      const type = data.sender === currentUser ? 'sent' : 'received';
      appendMessage('private-messages', data.sender, data.message, data.createdAt, type);
    });

    // ── TYPING EVENTS FROM SERVER ──
    socket.on('user_typing', ({ username, room }) => {
      if (username === currentUser) return;
      if (room === 'global') showTyping('global', username);
      else if (room === currentRoom) showTyping('private', username);
    });

    socket.on('user_stopped_typing', ({ username, room }) => {
      if (room === 'global') hideTyping('global', username);
      else hideTyping('private', username);
    });

    // ── ONLINE USERS ──
    socket.on('online_users', renderOnlineUsers);

    // ── CONNECTION ──
    socket.on('connect',    () => console.log('Socket connected:', socket.id));
    socket.on('disconnect', () => console.log('Socket disconnected'));

    // ── TEXTAREA EVENT SETUP ──
    // IME-safe: track composition state so Enter during Chinese input
    // (e.g. pinyin candidate selection) does NOT send the message.
    function setupTextarea(textareaId, counterId, sendFn, room) {
      const textarea = document.getElementById(textareaId);
      let isComposing = false;

      textarea.addEventListener('compositionstart', () => { isComposing = true; });
      textarea.addEventListener('compositionend',   () => { isComposing = false; });

      textarea.addEventListener('input', () => {
        autoResize(textarea);
        updateCharCounter(textareaId, counterId);
        // Only emit typing events when there is text and user has logged in
        if (currentUser && textarea.value.trim().length > 0) {
          const r = textareaId === 'global-input' ? 'global' : currentRoom;
          if (r) handleTyping(r);
        }
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          if (isComposing) return;   // Mid-IME: let the composition finish
          e.preventDefault();
          sendFn();
        }
        // Shift+Enter: default behaviour = newline (textarea handles it natively)
      });
    }

    setupTextarea('global-input',  'global-char-counter',  sendGlobalMessage,  'global');
    setupTextarea('private-input', 'private-char-counter', sendPrivateMessage, null);

    // ── AUTO-RESTORE SESSION ──
    (function restoreSession() {
      const savedToken = localStorage.getItem('chat_token');
      const savedUser  = localStorage.getItem('chat_user');
      if (!savedToken || !savedUser) return;

      currentToken = savedToken;
      currentUser  = savedUser;

      document.getElementById('logged-in-as').textContent = `Logged in as: ${currentUser}`;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');

      socket.emit('user_online', currentUser);
      loadGlobalHistory();
    })();
  </script>
</body>
</html>
